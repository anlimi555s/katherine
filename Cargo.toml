[workspace]
members = [
    "katherine-core",
    "katherine-engine",
    "katherine-cli",
]
resolver = "2"

[profile.release]
lto = true
strip = true
opt-level = "s"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
clap = { version = "4", features = ["derive"] }
tokio-util = "0.7"
futures = "0.3"
glob = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"
chromiumoxide = { version = "0.9", features = ["rustls", "zip8"] }
rusqlite = { version = "0.32", features = ["bundled"] }
