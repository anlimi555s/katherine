<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katherine</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; color:#c9d1d9; font:14px/1.6 'Segoe UI',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  #messages { flex:1; overflow-y:auto; padding:20px 20px 0; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
  .msg.selena { align-self:flex-end; background:#238636; color:#fff; }
  .msg.katherine { align-self:flex-start; background:#21262d; border:1px solid #30363d; }
  .tools { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; align-self:flex-start; max-width:85%; }
  .tool-line { font-size:12px; padding:4px 10px; border-radius:4px; background:#161b22; border-left:2px solid #30363d; color:#8b949e; }
  .tool-line.running { border-left-color:#d29922; }
  .tool-line.ok { border-left-color:#3fb950; }
  .tool-line.err { border-left-color:#f85149; }
  #status-bar { display:flex; align-items:center; gap:10px; padding:10px 20px; border-top:1px solid #21262d; background:#161b22; }
  #status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  #status-dot.idle { background:#8b949e; }
  #status-dot.thinking { background:#d29922; animation:pulse 0.8s infinite; }
  #status-dot.coding { background:#58a6ff; animation:pulse 0.5s infinite; }
  #status-dot.reading { background:#3fb950; }
  #status-dot.error { background:#f85149; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #status-text { font-size:12px; color:#8b949e; }
  #status-stats { font-size:11px; color:#484f58; margin-left:auto; }
  #input-area { display:flex; padding:12px 20px; gap:8px; }
  #input { flex:1; padding:10px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:#c9d1d9; resize:none; font:inherit; }
  #send { padding:10px 20px; border-radius:8px; border:none; background:#238636; color:#fff; cursor:pointer; font:inherit; }
  #send:hover { background:#2ea043; }
  #send:disabled { opacity:0.5; }
</style>
</head>
<body>
<div id="messages"></div>
<div id="status-bar">
  <div id="status-dot" class="idle"></div>
  <span id="status-text">Katherine 就位</span>
  <span id="status-stats"></span>
</div>
<div id="input-area">
  <textarea id="input" rows="2" placeholder="给 Katherine 发消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button id="send" onclick="send()">发送</button>
</div>
<script>
const ENGINE = 'http://127.0.0.1:9876';
let history = [];

function setStatus(key, extra) {
  const dot = document.getElementById('status-dot');
  dot.className = key||'idle';
  const texts = {idle:'Katherine 就位',thinking:'思考中',reading:'读文件',coding:'写代码',error:'出错了'};
  document.getElementById('status-text').textContent = texts[key]||key||'就位';
  if (extra) document.getElementById('status-stats').textContent = extra;
}

function toolStatus(name) {
  if (/read|glob|grep|recall/i.test(name)) return 'reading';
  if (/write|edit|bash|save/i.test(name)) return 'coding';
  return 'thinking';
}

async function checkHealth() {
  try { await fetch(ENGINE+'/health',{signal:AbortSignal.timeout(2000)}); setStatus('idle'); } catch { setStatus('error'); }
}
(async function init(){ await checkHealth(); }());

let streamAbort = null;

async function send() {
  const input = document.getElementById('input');
  const prompt = input.value.trim();
  if (!prompt) return;
  input.value = '';
  document.getElementById('send').disabled = true;

  // 显示用户消息
  const userDiv = document.createElement('div');
  userDiv.className = 'msg selena';
  userDiv.textContent = prompt;
  document.getElementById('messages').appendChild(userDiv);
  userDiv.scrollIntoView({behavior:'smooth'});

  // 工具行容器
  const toolBox = document.createElement('div');
  toolBox.className = 'tools';
  document.getElementById('messages').appendChild(toolBox);

  // Katherine 回复容器
  const katDiv = document.createElement('div');
  katDiv.className = 'msg katherine';
  katDiv.textContent = '';
  document.getElementById('messages').appendChild(katDiv);

  let replyText = '';
  const tools = [];

  function render() {
    toolBox.innerHTML = tools.map(t =>
      `<div class="tool-line ${t.status}">${t.icon} ${t.label}</div>`
    ).join('');
    katDiv.textContent = replyText || (tools.length > 0 ? '...' : '');
    if (replyText || tools.length > 0) katDiv.scrollIntoView({behavior:'smooth'});
  }

  setStatus('thinking');

  try {
    if (streamAbort) streamAbort.abort();
    streamAbort = new AbortController();
    const resp = await fetch(ENGINE+'/chat/stream', {
      method:'POST', signal:streamAbort.signal,
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt, history})
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        if (line.startsWith('data: [DONE]')) continue;
        try {
          const ev = JSON.parse(line.slice(6));
          const ty = ev.type || ev;
          // AgentEvent types: Text, ToolCall, ToolResult, TurnStarted, Done, Error
          if (typeof ty === 'object') continue;
          if (ty === 'Text' || ty === 'text') {
            replyText += (ev.text||'');
            render();
          } else if (ty === 'ToolCall' || ty === 'tool_call') {
            const name = ev.name||'?';
            tools.push({icon:'◌', label:name, status:'running'});
            setStatus(toolStatus(name), name);
            render();
          } else if (ty === 'ToolResult' || ty === 'tool_result') {
            const last = tools[tools.length-1];
            if (last) {
              last.icon = (ev.result&&ev.result.is_error) ? '✗' : '✓';
              last.status = (ev.result&&ev.result.is_error) ? 'err' : 'ok';
            }
            render();
          } else if (ty === 'TurnStarted' || ty === 'turn_started') {
            if (ev.turn) setStatus('thinking', '轮 '+ev.turn);
          } else if (ty === 'Done' || ty === 'done') {
            setStatus('idle');
          } else if (ty === 'Error' || ty === 'error') {
            tools.push({icon:'✗', label:(ev.error||'').slice(0,120), status:'err'});
            setStatus('error');
            render();
          }
        } catch {}
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') {
      tools.push({icon:'✗', label:'连接断开: '+e.message, status:'err'});
      setStatus('error');
      render();
    }
  }

  history.push({role:'user', content:prompt});
  if (replyText) history.push({role:'assistant', content:replyText});
  if (history.length > 20) history = history.slice(-20);
  streamAbort = null;
  document.getElementById('send').disabled = false;
  checkHealth();
}
</script>
</body>
</html>
